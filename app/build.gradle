plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('UNBAR_KEYSTORE_FILE')

android {
    namespace 'io.github.unbar'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.unbar'
        minSdk 27
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    if (releaseKeystorePath) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('UNBAR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UNBAR_KEY_ALIAS')
                keyPassword System.getenv('UNBAR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly project(':xposed-stubs')
}
