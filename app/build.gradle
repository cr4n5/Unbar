plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.unbar'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.unbar'
        minSdk 27
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly project(':xposed-stubs')
}
