name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check version tag
        run: |
          version=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UNBAR_KEYSTORE_BASE64 }}
          UNBAR_KEYSTORE_PASSWORD: ${{ secrets.UNBAR_KEYSTORE_PASSWORD }}
          UNBAR_KEY_ALIAS: ${{ secrets.UNBAR_KEY_ALIAS }}
          UNBAR_KEY_PASSWORD: ${{ secrets.UNBAR_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$UNBAR_KEYSTORE_PASSWORD"
          test -n "$UNBAR_KEY_ALIAS"
          test -n "$UNBAR_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/unbar-release.jks"
          chmod 600 "$RUNNER_TEMP/unbar-release.jks"
          echo "UNBAR_KEYSTORE_FILE=$RUNNER_TEMP/unbar-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          UNBAR_KEYSTORE_PASSWORD: ${{ secrets.UNBAR_KEYSTORE_PASSWORD }}
          UNBAR_KEY_ALIAS: ${{ secrets.UNBAR_KEY_ALIAS }}
          UNBAR_KEY_PASSWORD: ${{ secrets.UNBAR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify and name APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" "Unbar-${GITHUB_REF_NAME}.apk"
          sha256sum "Unbar-${GITHUB_REF_NAME}.apk" > "Unbar-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Unbar-${GITHUB_REF_NAME}.apk" \
            "Unbar-${GITHUB_REF_NAME}.apk.sha256" \
            --title "Unbar ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
